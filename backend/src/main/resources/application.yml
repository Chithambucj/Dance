server:
  port: 8085

spring:
  application:
    name: dance-studio-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=public}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:Admin@123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_YOUR_KEY_ID_HERE}
    key-secret: ${RAZORPAY_KEY_SECRET:YOUR_KEY_SECRET_HERE}

logging:
  level:
    com.dancestudio: INFO
    org.springframework.security: WARN
